<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>بيانات قطعة الأرض</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#fff;--fg:#10294a;--mut:#5b6b80;--line:#dde3ea;--acc:#1b6ca8}
@media (prefers-color-scheme:dark){:root{--bg:#16202c;--fg:#eaf1f8;--mut:#9fb0c3;--line:#2b3a4b;--acc:#6fb4ee}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--fg)}
#map{position:absolute;inset:0}
#sheet{position:absolute;z-index:1000;left:0;right:0;bottom:0;max-height:62%;overflow:auto;background:var(--bg);color:var(--fg);border-radius:16px 16px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.28);padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px))}
#sheet.min{max-height:54px;overflow:hidden}
#grab{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:800;font-size:16px;padding:4px 0 8px}
#grab span.chev{font-size:18px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.row b{color:var(--mut);font-weight:700;white-space:nowrap}
.row span{text-align:left;direction:rtl;word-break:break-word}
.row span.ltr{direction:ltr}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;text-align:center;background:var(--acc);color:#fff;text-decoration:none;border-radius:10px;padding:10px;font-weight:700;font-size:14px}
.btn.alt{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
#err{position:absolute;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--bg);font-size:17px;line-height:1.9}
.note{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.6}
.leaflet-container{font-family:inherit}
</style>
</head>
<body>
<div id="map"></div>
<div id="err"></div>
<div id="sheet" hidden>
  <div id="grab"><span>📍 بيانات قطعة الأرض</span><span class="chev" id="chev">▾</span></div>
  <div id="rows"></div>
  <div class="btns" id="btns"></div>
  <div class="note">الحدود والبيانات مضمّنة في الباركود نفسه وقت إصداره، ولا يُجرى أي استعلام عن قاعدة بيانات. للاستئناس وليست وثيقة رسمية.</div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
async function ahkamUnpackParcel(tok){
  const flag=tok[0],b=tok.slice(1).replace(/-/g,'+').replace(/_/g,'/'),bin=atob(b+'='.repeat((4-b.length%4)%4));
  let bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  if(flag==='z'){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(bytes).catch(()=>{});w.close().catch(()=>{});bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  else if(flag!=='r')throw new Error('bad');
  const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o||o.v!==1||!Array.isArray(o.p)||o.p.length<6||o.p.length%2||o.p.length>4000)throw new Error('bad');
  const ring=[];let la=0,lo=0;
  for(let k=0;k<o.p.length;k+=2){la+=Number(o.p[k]);lo+=Number(o.p[k+1]);const lat=la/1e6,lng=lo/1e6;if(!(Math.abs(lat)<=90&&Math.abs(lng)<=180))throw new Error('bad');ring.push([lng,lat])}
  return {o:String(o.o||''),i:String(o.i||''),r:String(o.r||''),c:String(o.c||''),l:String(o.l||''),a:Number(o.a)||0,n:String(o.n||''),ring};
}

function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.style.display='flex'}
function centroid(ring){
  const n=ring.length;let A=0,cx=0,cy=0;
  for(let i=0;i<n;i++){const a=ring[i],b=ring[(i+1)%n],w=a[0]*b[1]-b[0]*a[1];A+=w;cx+=(a[0]+b[0])*w;cy+=(a[1]+b[1])*w}
  let c=Math.abs(A)>1e-18?[cx/(3*A),cy/(3*A)]:[ring.reduce((t,q)=>t+q[0],0)/n,ring.reduce((t,q)=>t+q[1],0)/n];
  const inside=pt=>{let s=false;for(let i=0,j=n-1;i<n;j=i++){const a=ring[i],b=ring[j];if((a[1]>pt[1])!==(b[1]>pt[1])&&pt[0]<(b[0]-a[0])*(pt[1]-a[1])/(b[1]-a[1])+a[0])s=!s}return s};
  if(!inside(c)){const xs=[];for(let i=0;i<n;i++){const a=ring[i],b=ring[(i+1)%n];if((a[1]>c[1])!==(b[1]>c[1]))xs.push((b[0]-a[0])*(c[1]-a[1])/(b[1]-a[1])+a[0])}xs.sort((u,v)=>u-v);let bw=-1;for(let i=0;i+1<xs.length;i+=2){if(xs[i+1]-xs[i]>bw){bw=xs[i+1]-xs[i];c=[(xs[i]+xs[i+1])/2,c[1]]}}}
  return c;
}
(async function(){
  const tok=decodeURIComponent((location.hash||'').replace(/^#/,'')).trim();
  if(!tok){showErr('لا توجد بيانات أرض في هذا الرابط. امسح الباركود الصادر من أداة أحكام.');return}
  let d;try{d=await ahkamUnpackParcel(tok)}catch(e){showErr('تعذّرت قراءة بيانات الباركود؛ قد يكون ناقصًا أو تالفًا.');return}
  if(typeof L==='undefined'){showErr('تعذّر تحميل مكتبة الخريطة؛ تأكد من اتصال الإنترنت ثم أعد المحاولة.');return}
  const map=L.map('map',{zoomControl:true,attributionControl:true,zoomSnap:0.25,zoomDelta:0.5});
  // صورة الأقمار الصناعية: Clarity ثم World Imagery، مع اكتشاف بلاطات «Map data not yet available» والرجوع لبلاطة أعلى مستوى وتكبيرها (كما في أداة أحكام)
  const SRC={clarity:'https://clarity.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',wi:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'},ORDER=['clarity','wi'],MAXUP=8,blank=new Set(),cache=new Map(),inflight=new Map();
  const isBlankTile=img=>{try{const c=document.createElement('canvas');c.width=20;c.height=20;const x=c.getContext('2d');x.drawImage(img,0,0,20,20);const d=x.getImageData(0,0,20,20).data;let n=d.length/4,ss=0,sl=0,sq=0;
    for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,s=mx===mn?0:(mx-mn)/(1-Math.abs(2*l-1)||1);ss+=s;sl+=l;sq+=l*l}
    const m=sl/n,v=Math.max(0,sq/n-m*m);return m>0.55&&m<0.9&&ss/n<0.035&&v<0.012}catch(e){return false}};
  const loadTile=(src,z,x,y)=>{const k=src+'/'+z+'/'+x+'/'+y;if(blank.has(k))return Promise.resolve(null);if(cache.has(k))return Promise.resolve(cache.get(k));if(inflight.has(k))return inflight.get(k);
    const url=SRC[src].replace('{z}',z).replace('{y}',y).replace('{x}',x);
    const p=new Promise(res=>{const attempt=cors=>{const im=new Image();if(cors)im.crossOrigin='anonymous';
      im.onload=()=>{if(cors&&isBlankTile(im)===true){blank.add(k);res(null);return}cache.set(k,im);if(cache.size>300)cache.delete(cache.keys().next().value);res(im)};
      im.onerror=()=>{if(cors)attempt(false);else{blank.add(k);res(null)}};im.src=url};attempt(true)}).finally(()=>inflight.delete(k));
    inflight.set(k,p);return p};
  const resolveTile=async(z,x,y)=>{
    for(const s of ORDER){const im=await loadTile(s,z,x,y);if(im)return{im,up:0,xx:x,yy:y}}
    for(let up=1;up<=MAXUP&&z-up>=0;up++){for(const s of ORDER){const im=await loadTile(s,z-up,x>>up,y>>up);if(im)return{im,up,xx:x>>up,yy:y>>up}}}
    return null};
  const SmartEsri=L.TileLayer.extend({createTile(c,done){
    const sz=this.getTileSize(),sc=(window.devicePixelRatio||1)>1.4?2:1,t=document.createElement('canvas'),W=sz.x*sc,H=sz.y*sc;t.width=W;t.height=H;
    resolveTile(c.z,c.x,c.y).then(r=>{if(r){const g=t.getContext('2d');g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
      if(r.up===0)g.drawImage(r.im,0,0,W,H);else{const n=1<<r.up,sw=r.im.naturalWidth/n,sh=r.im.naturalHeight/n;g.drawImage(r.im,(c.x-(r.xx<<r.up))*sw,(c.y-(r.yy<<r.up))*sh,sw,sh,0,0,W,H)}}
      done(null,t)}).catch(()=>done(null,t));return t}});
  const sat=new SmartEsri('',{maxZoom:21,attribution:'Imagery © Esri, Maxar, Earthstar Geographics'});
  const lab=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:18,opacity:.9});
  const osm=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
  sat.addTo(map);lab.addTo(map);
  L.control.layers({'قمر صناعي':sat,'خريطة طرق':osm},{'الأسماء':lab},{position:'topleft'}).addTo(map);
  const ll=d.ring.map(p=>[p[1],p[0]]);
  const poly=L.polygon(ll,{color:'#ff3b30',weight:3,fillColor:'#ff3b30',fillOpacity:.35}).addTo(map);
  const c=centroid(d.ring);
  L.circleMarker([c[1],c[0]],{radius:6,color:'#fff',weight:1.5,fillColor:'#ffa500',fillOpacity:1}).addTo(map);
  const fit=()=>{const sh=document.getElementById('sheet'),h=sh.hidden?0:Math.min(sh.offsetHeight,window.innerHeight*0.62);map.invalidateSize();map.fitBounds(poly.getBounds(),{paddingTopLeft:[30,30],paddingBottomRight:[30,h+24],maxZoom:19})};
  // البيانات — تُعرض بـ textContent فقط
  const rows=document.getElementById('rows'),sheet=document.getElementById('sheet');
  const add=(k,v,ltr)=>{if(!v)return;const r=document.createElement('div');r.className='row';const b=document.createElement('b');b.textContent=k;const s=document.createElement('span');if(ltr)s.className='ltr';s.textContent=v;r.append(b,s);rows.append(r)};
  add('اسم المالك',d.o);add('رقم السجل المدني',d.i,true);add('المنطقة',d.r);add('المدينة',d.c);add('الموقع',d.l);
  if(d.a>0)add('المساحة',d.a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' م²');
  add('رقم الطلب',d.n,true);add('الإحداثيات',c[1].toFixed(6)+' , '+c[0].toFixed(6),true);
  const btns=document.getElementById('btns');
  const a1=document.createElement('a');a1.className='btn';a1.textContent='فتح في خرائط Google';a1.target='_blank';a1.rel='noopener noreferrer';a1.href='https://www.google.com/maps?q='+c[1].toFixed(6)+','+c[0].toFixed(6);
  const a2=document.createElement('a');a2.className='btn alt';a2.textContent='الاتجاهات إلى الأرض';a2.target='_blank';a2.rel='noopener noreferrer';a2.href='https://www.google.com/maps/dir/?api=1&destination='+c[1].toFixed(6)+','+c[0].toFixed(6);
  btns.append(a1,a2);
  sheet.hidden=false;fit();
  document.getElementById('grab').onclick=()=>{sheet.classList.toggle('min');document.getElementById('chev').textContent=sheet.classList.contains('min')?'▴':'▾';setTimeout(()=>{map.invalidateSize();fit()},50)};
  window.addEventListener('resize',()=>{map.invalidateSize();fit()});
})();
</script>
</body>
</html>
